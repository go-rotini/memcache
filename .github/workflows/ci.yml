name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: go-rotini/.github/.github/workflows/go-ci.yml@main
    with:
      jobs: |
        # The go.mod toolchain, and the newest Go release.
        - name: test
          run: make test
          go: ["", stable]
          artifact: test.out
        # Line endings, paths and snapshot files differ by OS.
        - name: test-os
          os: [macos-latest, windows-latest]
          lf: true
          run: |
            go test -count=1 ./...
            go test -race -count=1 ./...
        - name: acceptance
          run: make test-acceptance
        - name: lint
          run: make lint
        - name: fuzz
          run: make test-fuzz
        - name: corpus
          run: make test-corpus
        - name: benchmark
          run: make test-bench
          artifact: test_bench.out
        - name: race
          run: make test-race
