name: Bug Report
description: Report a bug in go-rotini/memcache
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: workload
    attributes:
      label: Workload Description
      description: |
        Describe how you're using the cache: eviction policy, key/value types,
        approximate throughput, max entries / max bytes, TTL, loader behavior,
        and any other options that may be relevant.
      render: text

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or stats output if applicable.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal Go code that reproduces the issue.
      render: go

  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: e.g. 1.26.2

  - type: input
    id: package-version
    attributes:
      label: Package Version
      placeholder: e.g. v0.1.0
